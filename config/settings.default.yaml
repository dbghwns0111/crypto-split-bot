exchange:
  name: bithumb
  membership: 화이트
pairs:
  ETH:
    ticker: KRW-ETH
    enabled: true
    capital: 2500000
    order_amount: 10000
    max_rounds: 50
    trigger_pct: 0.5
    trigger_mode: krw
    trigger_krw: 15000.0
  USDT:
    ticker: KRW-USDT
    enabled: true
    capital: 2500000
    order_amount: 10000
    max_rounds: 50
    trigger_pct: 0.5
    trigger_mode: krw
    trigger_krw: 10.0
strategy:
  trigger_min_pct: 0.3
  trigger_max_pct: 1.0
  sell_extra_pct: 0.08
  zone_normal_pct: 40
  zone_defensive_pct: 40
  zone_emergency_pct: 20
  reference_tracking_interval: 3600
  reference_tracking_pct: 10
  circuit_breaker_pct: 5.0
  circuit_breaker_window: 300
  order_timeout: 300
  price_poll_interval: 1
  catchup_max: 10
database:
  path: data/cryptosplit.db
telegram:
  enabled: true
web:
  host: 0.0.0.0
  port: 5000
  debug: false
  auth:
    enabled: true          # 웹 접근 보안 사용 여부 (비밀번호 설정 시에만 실제 활성)
    ip_whitelist: []       # 허용 IP 목록 (비어 있으면 모든 IP 허용)
    session_days: 30       # 로그인 유지 기간 (일)
    # 비밀번호는 .env 의 WEB_PASSWORD, 세션키는 WEB_SECRET_KEY 로 설정
logging:
  level: INFO
  dir: logs
  max_bytes: 10485760
  backup_count: 5
report:
  hour: 0
  minute: 0
system:
  time_sync_interval_hours: 6
  db_backup_interval_hours: 6   # DB 자동 백업 주기 (시간)
  db_backup_keep: 14            # 보관할 백업 파일 개수 (초과 시 오래된 것부터 삭제)
  watchdog_interval_min: 3      # 봇 스레드 헬스 점검 주기 (분)
