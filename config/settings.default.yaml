exchange:
  name: bithumb
  membership: 화이트
  fee_rate: 0.04  # 거래 수수료율(%). 이벤트 등으로 일시 변경 시 여기서 조정 (설정 탭에서도 가능)
pairs:
  ETH:
    ticker: KRW-ETH
    enabled: true          # 봇 인스턴스 생성 여부
    bulk_enabled: true     # 전체 가동/중지 명령 대상 여부 (OFF면 /resumeall·전체버튼에서 제외)
    capital: 2500000
    order_amount: 10000
    max_rounds: 50
    trigger_pct: 0.5       # 매수 간격(%) — pct 모드
    trigger_mode: krw
    trigger_krw: 15000.0   # 매수 간격(원) — krw 모드
    # trigger_pct_sell: 0.5      # 매도 전용 간격(%, 선택) — 미설정/0이면 매수와 동일
    # trigger_krw_sell: 15000.0  # 매도 전용 간격(원, 선택) — 미설정/0이면 매수와 동일
    auto_rebase_enabled: false  # 0차 상태에서 가격이 시작가 위로 계속 유지되면 시작가를 간격만큼씩 자동 상향(래칫)
  USDT:
    ticker: KRW-USDT
    enabled: true
    bulk_enabled: true
    capital: 2500000
    order_amount: 10000
    max_rounds: 50
    trigger_pct: 0.5
    trigger_mode: krw
    trigger_krw: 10.0
    auto_rebase_enabled: false
strategy:
  trigger_min_pct: 0.3
  trigger_max_pct: 1.0
  sell_extra_pct: 0.08
  zone_normal_pct: 40
  zone_defensive_pct: 40
  zone_emergency_pct: 20
  reference_tracking_interval: 3600
  reference_tracking_pct: 10
  circuit_breaker_pct: 5.0
  circuit_breaker_window: 300
  order_timeout: 300
  price_poll_interval: 1
  catchup_max: 10
  auto_rebase_interval_minutes: 30  # 자동 시작가 트레일링 판단 주기(분) — 이 주기마다 조건 확인 후 간격 1칸만 상향
database:
  path: data/cryptosplit.db
telegram:
  enabled: true
web:
  host: 0.0.0.0
  port: 5000
  debug: false
  auth:
    enabled: true          # 웹 접근 보안 사용 여부 (비밀번호 설정 시에만 실제 활성)
    ip_whitelist: []       # 허용 IP 목록 (비어 있으면 모든 IP 허용)
    session_days: 30       # 로그인 유지 기간 (일)
    # 비밀번호는 .env 의 WEB_PASSWORD, 세션키는 WEB_SECRET_KEY 로 설정
logging:
  level: INFO
  dir: logs
  max_bytes: 10485760
  backup_count: 5
report:
  hour: 0
  minute: 0
  hourly_interval_hours: 1      # 정각 현황 알림 발송 간격 (시간, 1=매시간 정각, 0시는 항상 제외)
  hourly_enabled: true          # 정각 현황 알림 사용 여부 (false로 끄면 알림 자체를 안 보냄)
system:
  ntp_clock_enabled: true       # 빗썸 API 타임스탬프를 NTP 기준으로 자체 보정 (OS 시계 드리프트 무력화)
  ntp_refresh_interval_sec: 60  # NTP 기준 시각 재측정 주기 (초)
  time_sync_interval_hours: 6   # Windows 시계 동기화 간격 (시간) — 설정 탭에서 변경 가능
  db_backup_interval_hours: 6   # DB 자동 백업 주기 (시간)
  db_backup_keep: 14            # 보관할 백업 파일 개수 (초과 시 오래된 것부터 삭제)
  watchdog_interval_min: 3      # 봇 스레드 헬스 점검 주기 (분)
