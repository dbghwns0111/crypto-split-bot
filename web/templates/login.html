<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CryptoSplit · 로그인</title>
  <meta name="theme-color" content="#FFF3D3" id="theme-color-meta">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('cs-theme'); } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.getElementById('theme-color-meta').setAttribute('content', dark ? '#1B1710' : '#FFF3D3');
    })();
  </script>
  <!-- 세션 만료로 이 화면에서 홈화면 바로가기를 만들어도 같은 아이콘이 쓰이도록 -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/icon-192.png') }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='images/icon-512.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px;
      background: var(--cs-bg);
    }
    .cs-login-card {
      width: 100%; max-width: 360px;
      background: var(--cs-card); border-radius: var(--cs-radius-lg);
      padding: 28px 24px 26px; box-shadow: var(--cs-shadow-md);
    }
    .cs-login-mascot { display: block; width: 96px; height: 96px; margin: -76px auto 6px; }
    .cs-login-title {
      text-align: center; color: var(--cs-text);
      font-family: var(--cs-font-display); font-size: 28px; margin-bottom: 4px;
    }
    .cs-login-sub {
      text-align: center; color: var(--cs-muted); font-size: 14px; margin-bottom: 22px;
    }
    .cs-login-input {
      width: 100%; box-sizing: border-box; min-height: 50px; padding: 0 16px;
      background: var(--cs-card2); border: none; border-radius: 16px;
      color: var(--cs-text); font-size: 16px; margin-bottom: 14px;
    }
    .cs-login-input:focus { outline: none; box-shadow: 0 0 0 2px var(--cs-gold); }
    .cs-login-btn {
      width: 100%; min-height: 52px; border: none; border-radius: 999px;
      background: var(--cs-gold); color: var(--cs-on-gold); font-size: 16px; font-weight: 700;
      cursor: pointer;
    }
    .cs-login-btn:active { transform: scale(0.98); }
    .cs-login-err {
      color: var(--cs-danger); font-size: 14px; text-align: center;
      margin-bottom: 14px; min-height: 1em;
    }
    .cs-login-wrap { padding-top: 70px; width: 100%; max-width: 360px; }
  </style>
</head>
<body>
  <div class="cs-login-wrap">
  <form class="cs-login-card" method="post" action="{{ url_for('auth.login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
    <img class="cs-login-mascot" src="{{ url_for('static', filename='images/icon-192.png') }}" alt="" width="96" height="96">
    <div class="cs-login-title">CryptoSplit</div>
    <div class="cs-login-sub">대시보드 비밀번호를 입력해 주세요</div>
    <div class="cs-login-err">{{ error or '' }}</div>
    <input class="cs-login-input" type="password" name="password"
           placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password" autofocus required>
    <button class="cs-login-btn" type="submit">로그인</button>
  </form>
  </div>
  <script src="{{ url_for('static', filename='js/capslock.js') }}"></script>
</body>
</html>
